<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squares Setup — Patriots vs Seahawks</title>

  <style>
    :root{
      --navy:#002244; --pat-red:#C60C30; --pat-silver:#B0B7BC;
      --hawk-green:#69BE28; --bg0:#070b14; --card:rgba(10,14,26,.78);
      --stroke:rgba(176,183,188,.22); --text:#EAF0FF; --muted:rgba(234,240,255,.72);
    }
    *{box-sizing:border-box}
    body{
      margin:18px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 15% 15%, rgba(198,12,48,.20), transparent 60%),
        radial-gradient(900px 600px at 85% 20%, rgba(105,190,40,.18), transparent 55%),
        linear-gradient(180deg, var(--bg0), #02040c);
    }
    h2{display:flex;align-items:center;gap:10px;font-size:22px;margin:0 0 12px}
    .dot{width:10px;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--pat-red),var(--hawk-green));
      box-shadow:0 0 12px rgba(105,190,40,.4),0 0 12px rgba(198,12,48,.4);}

    .layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,420px);
      gap:16px;
      align-items:start;
    }
    @media (max-width: 1200px){
      .layout{grid-template-columns:1fr}
      .sidebar{text-align:center}
    }

    .panel{
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:16px;
      padding:12px;
      box-shadow:0 12px 40px rgba(0,0,0,.35);
    }

    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
    input, button{
      padding:10px 12px;border-radius:12px;border:1px solid var(--stroke);
      background:rgba(255,255,255,.05);color:var(--text);
    }
    input{background:rgba(255,255,255,.04)}
    button{cursor:pointer;white-space:nowrap}
    button:hover{border-color:rgba(176,183,188,.38);background:rgba(255,255,255,.07)}

    .table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      overflow:hidden;
      border-radius:14px;
      border:1px solid rgba(176,183,188,.18);
    }
    .table th,.table td{
      padding:10px;
      border-bottom:1px solid rgba(176,183,188,.12);
      text-align:left;
    }
    .table th{color:var(--muted);font-size:13px;background:rgba(255,255,255,.03)}
    .table tr:last-child td{border-bottom:none}
    .mini{width:110px}
    .btnDanger{border-color:rgba(198,12,48,.45)}
    .btnPrimary{border-color:rgba(105,190,40,.45)}
    .muted{color:var(--muted);font-size:13px;line-height:1.35}

    .stat{
      display:flex;justify-content:space-between;gap:10px;
      padding:10px 12px;border:1px solid rgba(176,183,188,.18);
      border-radius:14px;margin-bottom:10px;text-align:left;
    }
    .stat strong{font-size:16px}

    .qrBox{
      width:min(400px,100%);
      aspect-ratio:1/1;
      max-width:400px;
      margin:16px auto;
      border-radius:28px;
      border:2px dashed rgba(176,183,188,.35);
      background:rgba(255,255,255,.04);
      display:flex;align-items:center;justify-content:center;
      box-shadow:
        0 0 0 2px rgba(255,255,255,.06),
        0 0 40px rgba(105,190,40,.25),
        0 0 40px rgba(198,12,48,.25);
    }
    .qrBox img{width:90%;height:90%;object-fit:contain;border-radius:20px}
  </style>
</head>

<body>
  <h2><span class="dot"></span>Squares Setup</h2>

  <div class="layout">
    <div class="panel">
      <div class="row">
        <input id="name" placeholder="Name (e.g., Robin)" style="flex:1;min-width:240px" />
        <input id="count" class="mini" type="number" min="1" value="1" />
        <button id="add" class="btnPrimary">Add</button>
        <button id="reset" class="btnDanger">Reset Game</button>
      </div>

      <div class="muted" style="margin-bottom:10px;">
        add names and number of squares. Total must equal <b>100</b>.
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>Name</th>
            <th style="width:140px;">Squares</th>
            <th style="width:120px;">Action</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>

      <div class="row" style="margin-top:12px;">
        <input id="seed" placeholder="Optional seed (e.g. 42)" class="mini" />
        <button id="fill" class="btnPrimary">Fill Board Randomly</button>
        <button id="assignGo" class="btnPrimary"> Let the games begin! </button>
      </div>

      <div id="msg" class="muted"></div>
    </div>

    <div class="panel sidebar">
      <div class="stat">
        <span>Filled Squares</span>
        <strong id="filled">0</strong>
      </div>
      <div class="stat">
        <span>Betting Total</span>
        <strong id="total">$0</strong>
      </div>

      <div class="qrBox">
        <!-- <img src="/static/venmo.jpeg" alt="Venmo QR Code" /> -->
      </div>
      <div class="muted" style="text-align:center;">
        Scan to pay • <b>$1 per square</b><br />
      </div>
    </div>
  </div>

  <script>
    const BET = 1;
    const entries = [];

    const els = {
      name: document.getElementById("name"),
      count: document.getElementById("count"),
      list: document.getElementById("list"),
      filled: document.getElementById("filled"),
      total: document.getElementById("total"),
      msg: document.getElementById("msg"),
      seed: document.getElementById("seed"),
    };

    function totalSquares(){
      return entries.reduce((sum, e) => sum + e.count, 0);
    }

    function renderList(){
      els.list.innerHTML = "";
      entries.forEach((e, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(e.name)}</td>
          <td>
            <input type="number" min="1" value="${e.count}" style="width:110px"
              data-i="${i}" class="cntEdit" />
          </td>
          <td><button class="btnDanger" data-del="${i}">Remove</button></td>
        `;
        els.list.appendChild(tr);
      });

      const t = totalSquares();
      els.filled.textContent = t;
      els.total.textContent = "$" + (t * BET);
      els.msg.textContent = (t === 100)
        ? "✅ Total is 100. You’re ready to fill the board."
        : `Total squares: ${t}/100`;
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[c]));
    }

    async function api(path, body){
      const r = await fetch(path, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: body ? JSON.stringify(body) : "{}"
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Request failed");
      return j;
    }

    async function getState(){
      const r = await fetch("/api/state");
      return r.json();
    }

    document.getElementById("add").addEventListener("click", () => {
      const name = els.name.value.trim();
      const count = Number(els.count.value || 1);
      if (!name) return;
      if (!Number.isFinite(count) || count <= 0) return;

      const existing = entries.find(x => x.name.toLowerCase() === name.toLowerCase());
      if (existing) existing.count += count;
      else entries.push({name, count});

      els.name.value = "";
      els.count.value = "1";
      renderList();
    });

    els.list.addEventListener("input", (e) => {
      if (!e.target.classList.contains("cntEdit")) return;
      const i = Number(e.target.dataset.i);
      const v = Number(e.target.value);
      if (!Number.isFinite(i) || !entries[i]) return;
      entries[i].count = Math.max(1, Math.floor(v || 1));
      renderList();
    });

    els.list.addEventListener("click", (e) => {
      const del = e.target.dataset.del;
      if (del === undefined) return;
      entries.splice(Number(del), 1);
      renderList();
    });

    document.getElementById("fill").addEventListener("click", async () => {
      try{
        if (totalSquares() !== 100) throw new Error("Total must be exactly 100.");
        await api("/api/fill-random", {
          seed: els.seed.value.trim() || null,
          entries
        });
        els.msg.textContent = "✅ Board filled! Now assign digits to start the game.";
      }catch(err){
        els.msg.textContent = "❌ " + err.message;
      }
    });

    document.getElementById("assignGo").addEventListener("click", async () => {
      try{
        // Ensure it's filled; assign-digits will error if not
        await api("/api/assign-digits", { seed: els.seed.value.trim() || null });
        window.location.href = "/board";
      }catch(err){
        els.msg.textContent = "❌ " + err.message + " (Did you click Fill Board first?)";
      }
    });

    document.getElementById("reset").addEventListener("click", async () => {
      try{
        await api("/api/reset");
        entries.length = 0;
        renderList();
        els.msg.textContent = "Reset complete.";
      }catch(err){
        els.msg.textContent = "❌ " + err.message;
      }
    });

    // Prefill sidebar with actual filled squares if you already have a state
    (async () => {
      const s = await getState();
      let filled = 0;
      for (let r=0;r<10;r++) for (let c=0;c<10;c++) if ((s.grid?.[r]?.[c]||"").trim()) filled++;
      els.filled.textContent = filled;
      els.total.textContent = "$" + (filled * BET);
      renderList();
    })();
  </script>
</body>
</html>
